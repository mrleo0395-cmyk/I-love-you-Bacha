<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My BACHA ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(#ff416c,#ff4b2b);
text-align:center;
color:white;
overflow-x:hidden;
}

.card{
background:rgba(0,0,0,0.35);
margin:15px;
padding:20px;
border-radius:20px;
}

img{
width:100%;
border-radius:15px;
margin-top:10px;
}

button{
padding:12px 25px;
border:none;
border-radius:25px;
font-size:16px;
background:white;
color:#ff416c;
margin:8px;
}

.heart{
position:fixed;
font-size:22px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{bottom:-10px;opacity:1;}
100%{bottom:100%;opacity:0;}
}
</.name{
  animation: glow 2s infinite alternate;
}

@keyframes glow{
  from{ text-shadow:0 0 5px pink; }
  to{ text-shadow:0 0 20px red; }
}>
</head>

<body onload="popup(); hearts();">

<h2>❤️ Happy Valentine BACHA ❤️</h2>

<div class="card">

<h3 class="name">Twinkle Gupta 💖</h3>

<p>
BACHA… tum meri duniya ho ❤️  
Tumhari smile meri sabse badi strength hai.

Main wada karta hoon –  
har situation mein tumhare saath rahunga,  
tumhe respect karunga,  
aur hamesha pyaar karunga 💕  

— Deepak
</p>

<button onclick="yes()">YES ❤️</button>
<button onclick="no()">NO 😜</button>

<br><br>

<a href="https://youtu.be/6Gy7V5r80iA?si=vR37nBWOfUKTVoeQ" target="_blank">

</a>

</div>

<script>

function popup(){
setTimeout(()=>{
alert("BACHA… Will you be my Valentine forever? ❤️");
},1500);
}

function yes(){
alert("YAYYY ❤️ I LOVE YOU SO MUCH BACHA 💕");
}

function no(){
alert("NO option sirf dikhane ke liye 😜 Tum meri ho ❤️");
}

function hearts(){
setInterval(()=>{
const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"%";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},300);
}

</script>

</body>
